name: deploy-pages

# 前端 SPA 部署到 GitHub Pages（构建产物 dist 自包含 data/，前端与数据同源）
# 前置一次性设置：仓库 Settings → Pages → Build and deployment → Source 选 "GitHub Actions"
on:
  workflow_dispatch:
  workflow_call: # U-18：供 fetch-data 在数据更新后同一次 run 内调用（GITHUB_TOKEN 的 push 不会触发其他 workflow）
    inputs:
      ref:
        description: '要构建部署的提交；留空则用触发本次运行的 SHA'
        type: string
        required: false
        default: ''
  push:
    branches: [main]
    paths-ignore:
      - 'data/**' # data 由 fetch-data 工作流更新，由其 deploy job 直接调用本工作流部署

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # U-18：workflow_call 默认取调用方 SHA，会漏掉 fetch 刚推送的数据提交
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
